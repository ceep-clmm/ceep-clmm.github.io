<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — Баррель Плюс</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">БАРРЕЛЬ <span>ПЛЮС</span></a>
      <button type="button" class="nav-toggle" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="main-nav" aria-label="Основная навигация">
        <ul>
          <li><a href="index.html">Главная</a></li>
          <li><a href="about.html">О компании</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="services.html">Услуги</a></li>
          <li><a href="calculator.html">Калькулятор</a></li>
          <li><a href="news.html">Новости</a></li>
          <li><a href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
      <form class="header-search" data-search-form action="search.html" role="search">
        <input type="search" name="q" placeholder="Поиск" aria-label="Поиск">
        <button type="submit" class="btn btn-primary btn-sm">Найти</button>
      </form>
    </div>
  </header>
  <main>
    <div class="container">
      <nav class="breadcrumbs" data-breadcrumbs aria-label="Хлебные крошки"></nav>
      <div id="product-detail" class="section"></div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand"><a href="index.html" class="logo">БАРРЕЛЬ <span>ПЛЮС</span></a></div>
      <nav class="footer-nav"><a href="catalog.html">Каталог</a><a href="contacts.html">Контакты</a></nav>
      <p class="footer-copy">© 2026 Баррель Плюс</p>
    </div>
  </footer>
  <div id="request-modal" class="modal" hidden role="dialog" aria-labelledby="modal-title">
    <div class="modal-overlay" data-modal-close></div>
    <div class="modal-dialog">
      <button type="button" class="modal-close" data-modal-close aria-label="Закрыть">×</button>
      <h2 id="modal-title">Оставить заявку</h2>
      <form data-feedback-form>
        <div class="form-group"><label for="modal-name">ФИО *</label><input type="text" id="modal-name" name="name" required><span class="field-error"></span></div>
        <div class="form-group"><label for="modal-phone">Телефон *</label><input type="tel" id="modal-phone" name="phone" required><span class="field-error"></span></div>
        <div class="form-group"><label for="modal-email">Email *</label><input type="email" id="modal-email" name="email" required><span class="field-error"></span></div>
        <div class="form-group checkbox-group"><label><input type="checkbox" name="consent" required> Согласен на обработку ПД</label><span class="field-error"></span></div>
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
